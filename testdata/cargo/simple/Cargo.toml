[package]
name = "cli-cargo-lib"
version = "1.0.0"
edition = "2021"
description = "Fixture crate for JFrog CLI Cargo integration tests"
license = "Apache-2.0"

# Production dependency (pulls transitive prod deps: serde, itoa, ryu, memchr)
# — exercises prod vs. transitive scoping in build-info.
[dependencies]
serde_json = "1"

# Dev-only dependency — MUST be EXCLUDED from build-info.
[dev-dependencies]
rand = "0.8"

# Build-script dependency — MUST appear with scope "build".
[build-dependencies]
cc = "1"
